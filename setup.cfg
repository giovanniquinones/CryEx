[metadata]
name = CryEx.v2
version = 2.0.4
author = Rong Zhen, Giovanni Quinones Valdez
author_email = giovas@ucla.edu
description = Cryptic Exon finder and splicing quantification
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/giovanniquinones/CryEx
project_urls =
    Bug Tracker = https://github.com/giovanniquinones/CryEx/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires = 
    multiprocess
    numpy>=1.23.5
    pandas==2.3.3
    pysam==0.23.2
    scipy>=1.10.1
    statsmodels>=0.14.6



[options.package_data]
* = *.pickle 

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    CryEx_stringtie = CryEx.CryEx_stringtie:main
    CryEx_junctions = CryEx.CryEx_junctions:main
    CryEx_psi_calculator = CryEx.CryEx_psi_calc:main
    CryEx_diff = CryEx.CryEx_diff:main
